# Must be used alongside interface/stlink.cfg (provided separately)
#
# Usage:
#   openocd --search "C:/ST/STM32CubeIDE_2.0.0/STM32CubeIDE/plugins/com.st.stm32cube.ide.mcu.debug.openocd_2.3.200.202510310951/resources/openocd/st_scripts" \
#           -f interface/stlink.cfg \
#           -f openocd.cfg
#
# For VS Code Cortex-Debug launch.json, debugServerArgs:
#   -s "<st_scripts_path>" -f interface/stlink.cfg -f openocd.cfg

